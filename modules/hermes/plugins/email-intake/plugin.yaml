name: email-intake-platform
label: Email intake
kind: platform
version: 1.0.0
description: >
  Financial email intake (issue #783). Scans every mailbox folder with EXAMINE
  and BODY.PEEK, classifies each new email once with Jev System One, and
  records the decision. Shadow mode never books, notifies, replies, or changes
  the mailbox; it rehearses each new expense transaction as a signed dry run
  (#796). Live books mail once expense-tracker reports its IDLE watcher off
  (the same EMAIL_INTAKE_MODE=live turns it off), marks it read and sends one
  Telegram message per email to the home chat (TELEGRAM_BOT_TOKEN,
  TELEGRAM_HOME_CHANNEL). It never starts an agent turn.
author: friday
requires_env:
  - name: EMAIL_INTAKE_MODE
    description: "'shadow' to classify and rehearse, 'live' to book (the cutover switch)"
    password: false
  - name: IMAP_HOST
    description: "IMAP host"
    password: false
  - name: IMAP_USERNAME
    description: "IMAP username"
    password: false
  - name: IMAP_PASSWORD
    description: "IMAP password"
    password: true
  - name: JEV_API_KEY
    description: "TypeSafe System One API key"
    password: true
optional_env:
  - name: EMAIL_INTAKE_INTERVAL
    description: "Seconds between scans (default 300, minimum 60)"
    password: false
  - name: HERMES_WEBHOOK_SECRET
    description: "Signs tracker /process requests; without it there is no rehearsal or dispatch"
    password: true
