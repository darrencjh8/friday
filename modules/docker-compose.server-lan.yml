# Override for the server while hermes runs on another machine (the laptop).
# The deploy jobs on the server add it through COMPOSE_FILE only when the
# repository variable SERVER_LAN_HOST is set; unset, the server reads only
# docker-compose.yml and nothing here applies.
#
# SERVER_LAN_HOST: the server's LAN address, where the modules are published.
# LAPTOP_LAN_HOST: the hermes machine's LAN address, the only one lan-guard
# lets reach those ports.
services:
    # Hermes on the laptop calls the router from the LAN with no router key,
    # as it did from the Docker network on the server; the front lets that one
    # address in, the same trust lan-guard gives it for the module ports.
    codex-router:
        environment:
            - CODEX_ROUTER_TRUSTED_IP=${LAPTOP_LAN_HOST:?LAPTOP_LAN_HOST is required}
    expense-tracker:
        ports:
            - "${SERVER_LAN_HOST:?SERVER_LAN_HOST is required}:8080:8080"
    portfolio-tracker:
        ports:
            - "${SERVER_LAN_HOST:?SERVER_LAN_HOST is required}:8081:8081"
    actual-api:
        ports:
            - "${SERVER_LAN_HOST:?SERVER_LAN_HOST is required}:3000:3000"
    whisper:
        ports:
            - "${SERVER_LAN_HOST:?SERVER_LAN_HOST is required}:8000:8000"

    # Drops connections to the ports above unless they come from the hermes
    # machine. A restarting container rather than a deploy step, so the rules
    # come back with Docker after a reboot.
    lan-guard:
        image: alpine:3.22
        network_mode: host
        cap_add:
            - NET_ADMIN
            - NET_RAW
        restart: unless-stopped
        mem_limit: 64m
        environment:
            - SERVER_LAN_HOST=${SERVER_LAN_HOST:?SERVER_LAN_HOST is required}
            - LAPTOP_LAN_HOST=${LAPTOP_LAN_HOST:?LAPTOP_LAN_HOST is required}
            - GUARDED_PORTS=8080 8081 3000 8000
        volumes:
            - ./lan-guard/guard.sh:/guard.sh:ro
        command: ["sh", "/guard.sh"]

    # Two-way folder sync with the hermes machine (modules/hermes-sync/sync.sh):
    # expense-tracker's data/ to the laptop, the laptop's wiki accounts back
    # here. It runs only when HERMES_TARGET is friday-laptop; any other value
    # (a deploy with target server, or no target at all) recreates it idle, so
    # the laptop's copy can never overwrite the server's before cutover.
    hermes-sync:
        image: alpine:3.22
        restart: unless-stopped
        mem_limit: 128m
        # NOTIFY_URL names the hermes service, which then runs on the laptop.
        extra_hosts:
            - "hermes:${LAPTOP_LAN_HOST:?LAPTOP_LAN_HOST is required}"
        environment:
            - HERMES_TARGET=${HERMES_TARGET:-server}
            - LAPTOP_LAN_HOST=${LAPTOP_LAN_HOST:?LAPTOP_LAN_HOST is required}
            - NOTIFY_URL=${NOTIFY_URL:-}
            - HERMES_WEBHOOK_SECRET=${HERMES_WEBHOOK_SECRET:-}
        volumes:
            - ./hermes-sync/sync.sh:/sync.sh:ro
            # deploy.sh writes the SSH key here; known_hosts is kept beside it.
            - /home/runner/data/hermes-sync:/state
            # Read-write only so SQLite can take its shared lock for the backup.
            - /home/runner/data/expense-tracker/data:/home/runner/data/expense-tracker/data
            - /home/runner/data/hermes/data/home/wiki/entities/accounts:/home/runner/data/hermes/data/home/wiki/entities/accounts
        command: ["sh", "/sync.sh"]
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"
