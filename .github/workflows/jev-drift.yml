name: Jev Drift Audit

on:
    schedule:
        - cron: "17 5 * * 1"
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Audit without filing issues"
                type: boolean
                default: true
            pairs:
                description: "Comma-separated pair ids (empty: all)"
                type: string
                default: ""

jobs:
    audit:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write
        env:
            JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
            GH_TOKEN: ${{ github.token }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Run Jev drift audit
              run: |
                  args=""
                  [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
                  [ -n "${{ inputs.pairs }}" ] && args="$args --pairs '${{ inputs.pairs }}'"
                  python3 scripts/jev_drift_audit.py $args --out /tmp/jev-drift-findings.json
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: jev-drift-findings
                  path: /tmp/jev-drift-findings.json
                  if-no-files-found: warn
