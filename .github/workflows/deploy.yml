name: Deploy to Production

on:
    push:
        branches: [main]
        paths-ignore:
            - ".gitmodules"

    workflow_dispatch:
        inputs:
            ref:
                description: "Branch, tag, or commit SHA (default: main)"
                type: string
                default: "main"
            environment:
                description: "Deployment environment"
                type: environment
                default: "darren-prod"
            force_all:
                description: "Force deploy all components (ignore changed-files detection)"
                type: boolean
                default: false
            components:
                description: "Specific component(s) to deploy (overrides detection)"
                type: choice
                default: ""
                options:
                    - ""
                    - all
                    - hermes
                    - portfolio-tracker
                    - expense-tracker
                    - actual-api
                    - codex-router
                    - dots-web
            hermes_target:
                description: "Where hermes runs: friday-laptop (the laptop runner) or server"
                type: choice
                default: friday-laptop
                options:
                    - friday-laptop
                    - server

# Where hermes deploys. A manual run takes the dropdown; a push to main takes
# the value after `||`: `friday-laptop` since the cutover. A rollback sets it
# back to `server` here and in deploy-hermes's `if`, where env is not available.
env:
    HERMES_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.hermes_target || 'friday-laptop' }}

concurrency:
    group: production-deploy
    cancel-in-progress: false

jobs:
    test:
        if: github.event_name != 'push'
        uses: ./.github/workflows/test.yml
        with:
            # The deploy job checks this same ref out below, so the reusable
            # workflow's image smoke has to test that tree and not the ref that
            # happened to dispatch the run.
            ref: ${{ github.event.inputs.ref || github.sha }}
        secrets:
            ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
            SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
            FRIDAY_PAT: ${{ secrets.FRIDAY_PAT }}

    deploy:
        if: always() && needs.test.result != 'failure'
        needs: test
        # The server's runner unless a repository variable names another one.
        runs-on: ${{ vars.DEPLOY_RUNNER_LABEL || 'self-hosted' }}
        permissions:
            contents: read
            actions: write
        environment:
            name: ${{ github.event.inputs.environment || 'darren-prod' }}
        # With SERVER_LAN_HOST set, every compose call here also reads the
        # server LAN override (module ports for the hermes machine, lan-guard).
        env:
            COMPOSE_FILE: ${{ vars.SERVER_LAN_HOST != '' && 'docker-compose.yml:docker-compose.server-lan.yml' || 'docker-compose.yml' }}
            SERVER_LAN_HOST: ${{ vars.SERVER_LAN_HOST }}
            LAPTOP_LAN_HOST: ${{ vars.LAPTOP_LAN_HOST }}
        steps:
            - &checkout-friday
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.ref || '' }}
                  fetch-depth: 0
                  clean: false
                  token: ${{ secrets.SUBMODULE_PAT }}

            - &checkout-codex-router
              uses: actions/checkout@v4
              with:
                  repository: darrencjh8/codex-router
                  ref: main
                  token: ${{ secrets.SUBMODULE_PAT }}
                  path: modules/codex-router

            # dots-web is built from hermes-dots web/ at a pinned commit, so every
            # update to the tailnet app is a reviewed bump of modules/hermes-dots.sha.
            - &read-hermes-dots-pin
              name: Read the pinned hermes-dots commit
              id: hermes_dots
              run: echo "sha=$(tr -d '[:space:]' < modules/hermes-dots.sha)" >> "$GITHUB_OUTPUT"

            - &checkout-hermes-dots
              uses: actions/checkout@v4
              with:
                  repository: darrencjh8/hermes-dots
                  ref: ${{ steps.hermes_dots.outputs.sha }}
                  token: ${{ secrets.SUBMODULE_PAT }}
                  path: modules/hermes-dots

            - &detect-changes
              name: Detect changed modules
              id: detect
              env:
                  FORCE_ALL: ${{ inputs.force_all || 'false' }}
                  DEPLOY_COMPONENTS_OVERRIDE: ${{ inputs.components || '' }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  DISPATCH_REF: ${{ inputs.ref || '' }}
              run: |

                  # Workflow dispatch with explicit components: use them directly
                  if [ -n "${DEPLOY_COMPONENTS_OVERRIDE:-}" ]; then
                      echo "components=${DEPLOY_COMPONENTS_OVERRIDE}" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  # Workflow dispatch with force_all: deploy everything
                  if [ "${FORCE_ALL:-false}" = "true" ]; then
                      echo "components=all" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  # Resolve the base: the last successful deploy's commit, so a
                  # run that replaces a cancelled queued run ships everything
                  # since then, not just its own commit.
                  BASE_SHA="${LAST_SUCCESSFUL_DEPLOY_SHA:-}"
                  if [ -z "$BASE_SHA" ]; then
                      LOOKUP_BASE=false
                      if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
                          LOOKUP_BASE=true
                      elif [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
                          if [ -z "${DISPATCH_REF:-}" ] || [ "${DISPATCH_REF:-}" = "main" ]; then
                              LOOKUP_BASE=true
                          fi
                      fi
                      if [ "$LOOKUP_BASE" = "true" ]; then
                          BASE_SHA=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/380193322/runs?branch=main&status=success&event=push&per_page=1" 2>/dev/null | sed -n 's/.*"head_sha": *"\([0-9a-f]\{40\}\)".*/\1/p' | head -n 1 || true)
                      fi
                  fi
                  if [ -z "$BASE_SHA" ]; then
                      echo "components=all" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  git merge-base --is-ancestor "$BASE_SHA" HEAD || { echo "components=all" >> "$GITHUB_OUTPUT"; exit 0; }
                  CHANGED=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null || echo "")
                  COMPONENTS=""
                  echo "$CHANGED" | grep -q "^modules/hermes/"          && COMPONENTS="$COMPONENTS hermes"
                  echo "$CHANGED" | grep -q "^modules/expense-tracker/" && COMPONENTS="$COMPONENTS expense-tracker"
                  echo "$CHANGED" | grep -q "^modules/portfolio-tracker/" && COMPONENTS="$COMPONENTS portfolio-tracker"
                  echo "$CHANGED" | grep -q "^modules/actual-api/"     && COMPONENTS="$COMPONENTS actual-api"
                  # The front's Caddyfile decides what 4100 serves, so a change to
                  # it must reach the host through a router deployment.
                  echo "$CHANGED" | grep -q "^modules/codex-router-front/" && COMPONENTS="$COMPONENTS codex-router"
                  echo "$CHANGED" | grep -q "^gateway/"                && COMPONENTS="$COMPONENTS hermes"
                  # A change to the helper, its cron wiring, or the compose mount
                  # must reach the host through a router deployment.
                  echo "$CHANGED" | grep -q "^modules/fetch-claude-usage.py" && COMPONENTS="$COMPONENTS codex-router"
                  echo "$CHANGED" | grep -q "^\.github/"               && COMPONENTS="$COMPONENTS hermes"
                  echo "$CHANGED" | grep -qE "^(\.github/workflows/deploy\.yml|modules/(docker-compose\.yml|deploy\.sh))$" && COMPONENTS="$COMPONENTS codex-router"
                  # A bump of the hermes-dots pin rebuilds the tailnet web app.
                  echo "$CHANGED" | grep -q "^modules/hermes-dots\.sha$" && COMPONENTS="$COMPONENTS dots-web"
                  # Only documentation changed: deploy nothing. `none`, because an
                  # empty output reads as `all` downstream. Any other unmatched
                  # change keeps the safe default below and deploys everything.
                  if [ -z "$COMPONENTS" ] && [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qvE '(^docs/|\.md$)'; then
                      COMPONENTS=none
                  elif [ -z "$COMPONENTS" ] || echo "$CHANGED" | grep -qE "^(Dockerfile|deploy\.sh|modules/(docker-compose\.yml|deploy\.sh)$)"; then
                      COMPONENTS="all"
                  fi
                  echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"

            # Hermes can run on its own runner (the deploy-hermes job below).
            # When HERMES_TARGET is friday-laptop, this job drops hermes from its
            # list and `all` becomes every other compose service. Otherwise the
            # detected list passes through unchanged. `hermes` reports whether
            # the detected list deploys hermes at all, for deploy-hermes.
            - &split-hermes
              name: Split hermes off to its own runner
              id: changes
              env:
                  DETECTED: ${{ steps.detect.outputs.components || 'all' }}
              run: |
                  if [ "$DETECTED" = none ]; then
                      echo "nothing to deploy"
                      echo "hermes=false" >> "$GITHUB_OUTPUT"
                      echo "components=" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  case " $DETECTED " in
                      *" all "*|*" hermes "*) echo "hermes=true" >> "$GITHUB_OUTPUT" ;;
                      *) echo "hermes=false" >> "$GITHUB_OUTPUT" ;;
                  esac
                  if [ "$HERMES_TARGET" != friday-laptop ]; then
                      echo "components=$DETECTED" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  case " $DETECTED " in
                      *" all "*) LIST=$(docker-compose --project-name modules -f modules/docker-compose.yml config --services) ;;
                      *) LIST=$DETECTED ;;
                  esac
                  LIST=$(printf '%s\n' "$LIST" | tr ' ' '\n' | grep -vx hermes | xargs || true)
                  echo "components=$LIST" >> "$GITHUB_OUTPUT"

            # dots-web builds Friday's clips (android) and icons (dots-web) from the
            # friday-persona release pinned in hermes-dots' persona-media.version.
            - name: Fetch persona media
              env:
                  GH_TOKEN: ${{ secrets.SUBMODULE_PAT }}
              run: |
                  bash ./scripts/fetch-persona-media.sh dots-web modules/hermes-dots/web
                  bash ./scripts/fetch-persona-media.sh android modules/hermes-dots

            # Empty when nothing deployable changed, or when hermes was the whole
            # list and deploys elsewhere.
            - name: Build images
              if: steps.changes.outputs.components != ''
              env:
                  DEPLOY_COMPONENTS: ${{ steps.changes.outputs.components || 'all' }}
              run: &build-run |
                  mkdir -p /home/runner/data/{expense-tracker/data,expense-tracker/state,portfolio-tracker/data,hermes/{data,workspace},codex-router}
                  if [ "${DEPLOY_COMPONENTS}" = "all" ]; then
                      bash ./modules/build.sh
                  else
                      ARGS=""
                      for c in ${DEPLOY_COMPONENTS}; do ARGS="$ARGS --component $c"; done
                      bash ./modules/build.sh $ARGS
                  fi

            - name: Deploy services
              if: steps.changes.outputs.components != ''
              env: &deploy-env
                  GITHUB_ACTIONS: true
                  HERMES_WORKSPACE: /home/darren/workspace/hermes
                  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
                  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
                  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
                  SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
                  HERMES_WEBHOOK_SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
                  # Browser Webapp (v0.23) sign-in: shares the dashboard's
                  # basic-auth provider (trusted tailnet). HERMES_DASHBOARD
                  # itself stays unset so the retired s6 slot stays down.
                  HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_USERNAME }}
                  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_PASSWORD }}
                  # Real tailnet URL baked into webapp.public_url at boot.
                  WEBAPP_PUBLIC_URL: ${{ vars.WEBAPP_PUBLIC_URL }}
                  GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
                  ACTUAL_BUDGET_PASSWORD: ${{ secrets.ACTUAL_BUDGET_PASSWORD }}
                  IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
                  IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
                  # hermes-sync's alert email goes where the PII scan reports go.
                  ALERT_EMAIL_TO: ${{ secrets.PII_SCAN_EMAIL_TO }}
                  ONEDRIVE_CLIENT_ID: ${{ secrets.ONEDRIVE_CLIENT_ID }}
                  IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
                  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
                  GTASKS_CLIENT_ID: ${{ secrets.GTASKS_CLIENT_ID }}
                  GTASKS_CLIENT_SECRET: ${{ secrets.GTASKS_CLIENT_SECRET }}
                  REMINDERS_EDIT_TOKEN: ${{ secrets.REMINDERS_EDIT_TOKEN }}
                  BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
                  CODEX_ROUTER_AUTH_PASSWORD: ${{ secrets.CODEX_ROUTER_AUTH_PASSWORD }}
                  LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
                  # GitHub secret MUSE_API_KEY maps to the runtime MODEL_API_KEY
                  # name the upstream meta-ai provider reads.
                  MODEL_API_KEY: ${{ secrets.MUSE_API_KEY }}
                  OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
                  OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
                  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
                  CLINE_API_KEY: ${{ secrets.CLINE_API_KEY }}
                  CODEX_ROUTER_OPENCODE_ZEN_MODELS: ${{ vars.CODEX_ROUTER_OPENCODE_ZEN_MODELS || 'space-bunny-free' }}
                  # Per-hop budget for the auto-thinking pool. The router's own
                  # default is 120, which is short for a reasoning model, and it is
                  # below the opencode-free lane's own 300s turn deadline, so a hop
                  # budget under 300 always pre-empts the lane. Not a secret: it is
                  # a duration, and a repository variable overrides it.
                  CODEX_ROUTER_AUTO_THINKING_TIMEOUT_SECONDS: ${{ vars.CODEX_ROUTER_AUTO_THINKING_TIMEOUT_SECONDS || '300' }}
                  # 1 turns on the router's per-request timing and access logs.
                  CODEX_ROUTER_REQUEST_LOGS: ${{ vars.CODEX_ROUTER_REQUEST_LOGS || '0' }}
                  LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'litellm' }}
                  LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'http://codex-router:4100/v1' }}
                  LLM_MODEL: ${{ vars.LLM_MODEL || 'auto-thinking' }}
                  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
                  LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT || 'low' }}
                  LLM_FALLBACK_MODEL: ${{ vars.LLM_FALLBACK_MODEL || '' }}
                  LLM_FINAL_FALLBACK_PROVIDER: ${{ vars.LLM_FINAL_FALLBACK_PROVIDER || 'deepseek' }}
                  LLM_FINAL_FALLBACK_MODEL: ${{ vars.LLM_FINAL_FALLBACK_MODEL || 'deepseek-flash' }}
                  FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
                  DOTS_TOKEN: ${{ secrets.DOTS_TOKEN }}
                  DOTS_WEB_ORIGINS: ${{ secrets.DOTS_WEB_ORIGINS }}
                  DOTS_FCM_SERVICE_ACCOUNT: ${{ secrets.DOTS_FCM_SERVICE_ACCOUNT }}
                  NOTION_API_KEY: ${{ secrets.NOTION_API_TOKEN }}
                  OPENCODE_SERVER_PASSWORD: ${{ secrets.OPENCODE_SERVER_PASSWORD }}
                  BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
                  BWS_PROJECT: ${{ vars.BWS_PROJECT }}
                  EMAIL_INTAKE_MODE: ${{ vars.EMAIL_INTAKE_MODE }}
                  POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
                  JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
                  TELEGRAM_ALLOWED_USERS: ${{ vars.TELEGRAM_ALLOWED_USERS }}
                  TELEGRAM_HOME_CHANNEL: ${{ vars.TELEGRAM_HOME_CHANNEL }}
                  SLACK_ALLOWED_USERS: ${{ vars.SLACK_ALLOWED_USERS }}
                  SLACK_HOME_CHANNEL: ${{ vars.SLACK_HOME_CHANNEL }}
                  SLACK_HOME_CHANNEL_NAME: ${{ vars.SLACK_HOME_CHANNEL_NAME }}
                  MEMORY_REPO_URL: ${{ vars.MEMORY_REPO_URL }}
                  GH_APP_ID: ${{ vars.GH_APP_ID }}
                  GH_APP_INSTALLATION_ID: ${{ vars.GH_APP_INSTALLATION_ID }}
                  IDENTITY_NAME: ${{ vars.IDENTITY_NAME }}
                  IDENTITY_EMOJI: ${{ vars.IDENTITY_EMOJI }}
                  IDENTITY_VIBE: ${{ vars.IDENTITY_VIBE }}
                  SOUL_VOICE_TONE: ${{ vars.SOUL_VOICE_TONE }}
                  SOUL_VOICE_STYLE: ${{ vars.SOUL_VOICE_STYLE }}
                  SOUL_VOICE_RULES: ${{ vars.SOUL_VOICE_RULES }}
                  SOUL_DELEGATION: ${{ vars.SOUL_DELEGATION }}
                  ACTUAL_BUDGET_URL: ${{ vars.ACTUAL_BUDGET_URL }}
                  ACTUAL_PRIMARY_BUDGET_FILE: ${{ vars.ACTUAL_PRIMARY_BUDGET_FILE }}
                  ACTUAL_SECONDARY_BUDGET_FILE: ${{ vars.ACTUAL_SECONDARY_BUDGET_FILE }}
                  ACTUAL_PRIMARY_CURRENCY: ${{ vars.ACTUAL_PRIMARY_CURRENCY }}
                  ACTUAL_SECONDARY_CURRENCY: ${{ vars.ACTUAL_SECONDARY_CURRENCY }}
                  NOTIFY_URL: ${{ vars.NOTIFY_URL }}
                  IMAP_HOST: ${{ vars.IMAP_HOST }}
                  IBKR_FLEX_QUERY_ID: ${{ vars.IBKR_FLEX_QUERY_ID }}
                  IBKR_PP_SGD_ACCOUNT: ${{ vars.IBKR_PP_SGD_ACCOUNT }}
                  IBKR_PP_USD_ACCOUNT: ${{ vars.IBKR_PP_USD_ACCOUNT }}
                  GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
                  TAXONOMY_SHEET_MAPPING: ${{ vars.TAXONOMY_SHEET_MAPPING }}
                  TAXONOMY_NAMES: ${{ vars.TAXONOMY_NAMES }}
                  PP_OFFSET_MAP: ${{ vars.PP_OFFSET_MAP }}
                  SUBMODULE_PAT: ${{ secrets.SUBMODULE_PAT }}
                  FRIDAY_PAT: ${{ secrets.FRIDAY_PAT }}
                  # hermes-sync's SSH key for the laptop; deploy.sh writes it to a
                  # root-only file on the server and nowhere else.
                  LAPTOP_SSH_KEY: ${{ secrets.LAPTOP_SSH_KEY }}
                  DEPLOY_COMPONENTS: ${{ steps.changes.outputs.components || 'all' }}
                  FORCE_ALL: ${{ inputs.force_all || 'false' }}
                  DEPLOY_COMPONENTS_OVERRIDE: ${{ inputs.components || '' }}
              run: |
                  if [ "${DEPLOY_COMPONENTS}" = "all" ]; then
                      bash ./modules/deploy.sh --component all --non-interactive --skip-build
                  else
                      ARGS=""
                      for c in ${DEPLOY_COMPONENTS}; do ARGS="$ARGS --component $c"; done
                      bash ./modules/deploy.sh $ARGS --non-interactive --skip-build
                  fi

            - name: Ensure Hermes container tooling
              if: >-
                  always() &&
                  (steps.changes.outputs.components == 'all' || contains(format(' {0} ', steps.changes.outputs.components), ' hermes '))
              env: &tooling-env
                  # Authenticates the release lookup below; unauthenticated
                  # api.github.com calls are limited to 60 per hour per IP and a
                  # rate limit here would fail the deploy.
                  GH_TOKEN: ${{ secrets.FRIDAY_PAT }}
              run: &tooling-run |
                  # gh and ntn are installed into the container's persisted
                  # /opt/data volume, which is already on the image PATH, rather
                  # than baked into an image layer. Rebuilding the image or
                  # recreating the container therefore reuses them instead of
                  # reinstalling. Each install is skipped when the tool exists.
                  if ! docker exec hermes sh -c 'command -v gh' >/dev/null 2>&1; then
                      gh_version=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                          https://api.github.com/repos/cli/cli/releases/latest \
                          | sed -n 's/.*"tag_name": *"v\([^"]*\)".*/\1/p')
                      gh_arch=$(docker exec hermes dpkg --print-architecture)
                      docker exec hermes sh -c "
                          mkdir -p /opt/data/.local/bin &&
                          curl -fsSL https://github.com/cli/cli/releases/download/v${gh_version}/gh_${gh_version}_linux_${gh_arch}.tar.gz | tar -xz -C /tmp &&
                          install -m 0755 /tmp/gh_${gh_version}_linux_${gh_arch}/bin/gh /opt/data/.local/bin/gh &&
                          rm -rf /tmp/gh_${gh_version}_linux_${gh_arch}"
                  fi
                  if ! docker exec hermes sh -c 'command -v ntn' >/dev/null 2>&1; then
                      docker exec hermes npm install --global --prefix /opt/data/.local ntn
                  fi
                  docker exec hermes sh -c 'gh --version && ntn --version'

            - name: Record deployed Codex Router revision
              if: >-
                  success() &&
                  (steps.changes.outputs.components == 'all' || contains(format(' {0} ', steps.changes.outputs.components), ' codex-router '))
              run: |
                  mkdir -p /tmp/router-sha
                  git -C modules/codex-router rev-parse HEAD > /tmp/router-sha/codex-router-sha.txt

            - uses: actions/upload-artifact@v4
              if: >-
                  success() &&
                  (steps.changes.outputs.components == 'all' || contains(format(' {0} ', steps.changes.outputs.components), ' codex-router '))
              with:
                  name: codex-router-sha
                  path: /tmp/router-sha/codex-router-sha.txt
                  if-no-files-found: error

    # Deploys hermes alone to the friday-laptop runner when HERMES_TARGET is
    # friday-laptop; the deploy job above then leaves hermes out. Otherwise it
    # is skipped and hermes deploys with everything else on the server.
    # The steps are the deploy job's own, reused through YAML anchors.
    deploy-hermes:
        if: always() && needs.test.result != 'failure' && (github.event_name == 'workflow_dispatch' && inputs.hermes_target || 'friday-laptop') == 'friday-laptop'
        needs: test
        runs-on: friday-laptop
        permissions:
            contents: read
        environment:
            name: ${{ github.event.inputs.environment || 'darren-prod' }}
        # build.sh and deploy.sh run docker-compose from modules/, so COMPOSE_FILE
        # layers the laptop override on every compose call without touching them.
        env:
            COMPOSE_FILE: docker-compose.yml:docker-compose.laptop.yml
            SERVER_LAN_HOST: ${{ vars.SERVER_LAN_HOST }}
            LAPTOP_LAN_HOST: ${{ vars.LAPTOP_LAN_HOST }}
            # Hermes's module-docker reaches the server's Docker over SSH with
            # this account, key and pinned host key (see deploy.sh). Only this
            # laptop job receives them; the server deploy never does.
            SERVER_SSH_USER: ${{ vars.SERVER_SSH_USER }}
            SERVER_SSH_HOST_KEY: ${{ vars.SERVER_SSH_HOST_KEY }}
            HERMES_SERVER_SSH_KEY: ${{ secrets.HERMES_SERVER_SSH_KEY }}
        steps:
            - *checkout-friday
            # deploy.sh syncs the codex-router skills into the Hermes container
            # and refreshes its checkout there; the compose file it validates
            # names the hermes-dots build context.
            - *checkout-codex-router
            - *read-hermes-dots-pin
            - *checkout-hermes-dots
            - *detect-changes
            - *split-hermes

            - name: Build hermes image
              if: steps.changes.outputs.hermes == 'true'
              env:
                  DEPLOY_COMPONENTS: hermes
              run: *build-run

            - name: Deploy hermes
              if: steps.changes.outputs.hermes == 'true'
              env: *deploy-env
              run: bash ./modules/deploy.sh --component hermes --non-interactive --skip-build

            - name: Ensure Hermes container tooling
              if: always() && steps.changes.outputs.hermes == 'true'
              env: *tooling-env
              run: *tooling-run
