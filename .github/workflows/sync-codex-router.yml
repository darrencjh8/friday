name: Sync Codex Router

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  deploy-if-updated:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Read router main revision
        id: remote
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_PAT }}
        run: echo "sha=$(gh api repos/darrencjh8/codex-router/commits/main --jq .sha)" >> "$GITHUB_OUTPUT"

      - name: Compare router main with deployed revision
        id: router
        env:
          GH_TOKEN: ${{ github.token }}
          REMOTE_SHA: ${{ steps.remote.outputs.sha }}
        run: |
          deployed_sha=""
          page=1
          while [ -z "$deployed_sha" ]; do
            run_ids="$(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=100&page=$page" --jq '.workflow_runs[].id')"
            [ -n "$run_ids" ] || break
            for run_id in $run_ids; do
              rm -rf /tmp/router-sha
              if gh run download "$run_id" --repo ${{ github.repository }} -n codex-router-sha -D /tmp/router-sha >/dev/null 2>&1; then
                deployed_sha="$(cat /tmp/router-sha/codex-router-sha.txt)"
                break
              fi
            done
            page=$((page + 1))
          done
          echo "remote_sha=$REMOTE_SHA" >> "$GITHUB_OUTPUT"
          if [ "$REMOTE_SHA" != "$deployed_sha" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch router-only deployment
        if: steps.router.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run deploy.yml --repo ${{ github.repository }}
          --ref main -f components=codex-router
