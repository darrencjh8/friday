name: Migrate Hermes data

# Copies /home/runner/data/hermes between the server and the laptop for the
# cutover in docs/plans/move-runtime-to-laptop.md (to-laptop) and its rollback
# (to-server). Both directions run on the server's runner: the laptop's SSH key
# only authorizes logins from the server, so the server starts every transfer,
# pushing for to-laptop and pulling for to-server.
#
# rsync runs as root in a small alpine container on each side (the data is
# owned by the container user, and the server host has no rsync), copying into
# a stage directory, .migrate-hermes-stage, on the receiving side. The stage is
# kept between runs, so each run copies only what changed since the last one.
#
# dry_run (the default) copies into the stage while hermes keeps running and
# stops there. Run it first: it moves the bulk of the data with no downtime.
# dry_run=false copies again while hermes still runs, then stops the server's
# hermes (to-laptop) or requires the laptop's hermes to be stopped already
# (to-server), makes a final pass, checks that nothing differs, moves any
# existing hermes directory on the receiving side aside to
# hermes.bak-<timestamp>, and renames the stage into place. rsync --delete
# only ever applies inside the stage; nothing else is deleted.

on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Archive, copy and verify only: do not stop hermes or extract"
                type: boolean
                default: true
            direction:
                description: "to-laptop (cutover) or to-server (rollback)"
                type: choice
                default: to-laptop
                options:
                    - to-laptop
                    - to-server

# Same group as deploy.yml, so a migration never overlaps a deploy.
concurrency:
    group: production-deploy
    cancel-in-progress: false

permissions: {}

jobs:
    migrate:
        runs-on: self-hosted
        environment:
            name: darren-prod
        timeout-minutes: 120
        env:
            DRY_RUN: ${{ inputs.dry_run }}
            DIRECTION: ${{ inputs.direction }}
            SERVER_LAN_HOST: ${{ vars.SERVER_LAN_HOST }}
            LAPTOP_LAN_HOST: ${{ vars.LAPTOP_LAN_HOST }}
            DATA_ROOT: /home/runner/data
        steps:
            - name: Migrate hermes data
              id: migrate
              env:
                  LAPTOP_SSH_KEY: ${{ secrets.LAPTOP_SSH_KEY }}
              run: |
                  set -euo pipefail
                  : "${SERVER_LAN_HOST:?repository variable SERVER_LAN_HOST is not set}"
                  : "${LAPTOP_LAN_HOST:?repository variable LAPTOP_LAN_HOST is not set}"
                  : "${LAPTOP_SSH_KEY:?environment secret LAPTOP_SSH_KEY is not set}"
                  case "$DIRECTION" in
                      to-laptop) SRC=server DST=laptop ;;
                      to-server) SRC=laptop DST=server ;;
                      *) echo "unknown direction: $DIRECTION" >&2; exit 1 ;;
                  esac
                  # "server" must really be this machine, not another runner.
                  hostname -I | tr ' ' '\n' | grep -xF "$SERVER_LAN_HOST" >/dev/null \
                      || { echo "this runner is not the server ($SERVER_LAN_HOST)" >&2; exit 1; }

                  STAGE=.migrate-hermes-stage
                  IMAGE=friday-rsync:1
                  KEY=$(mktemp)
                  chmod 600 "$KEY"
                  printf '%s\n' "$LAPTOP_SSH_KEY" > "$KEY"
                  trap 'rm -f "$KEY"' EXIT
                  SSH="ssh -p 2222 -i $KEY -o BatchMode=yes -o StrictHostKeyChecking=accept-new"

                  # On the laptop, Docker Desktop's default config names a Windows
                  # credential helper that cannot run over SSH, so docker there
                  # reads the same config the friday-laptop runner uses.
                  LAPTOP_ENV="export DOCKER_CONFIG=/home/darren/.docker-friday;"
                  run_on() { # run_on server|laptop <command>
                      if [ "$1" = server ]; then bash -c "$2"
                      else $SSH "darren@$LAPTOP_LAN_HOST" "$LAPTOP_ENV $2"; fi
                  }
                  hermes_running() { # hermes_running server|laptop
                      [ "$(run_on "$1" "docker inspect -f '{{.State.Running}}' hermes 2>/dev/null || true")" = true ]
                  }
                  free_kb() { run_on "$1" "df -Pk '$DATA_ROOT' | awk 'NR==2 {print \$4}'"; }
                  phase() { echo "== $1 (+${SECONDS}s)"; }

                  # The server's end of rsync runs here; the laptop's end runs in
                  # the same image there, started over ssh as rsync's remote
                  # command. Both see DATA_ROOT as /d. The uv caches are skipped:
                  # uv downloads them again.
                  if [ "$SRC" = server ]; then
                      FROM=/d/hermes/ TO="darren@$LAPTOP_LAN_HOST:/d/$STAGE/"
                  else
                      FROM="darren@$LAPTOP_LAN_HOST:/d/hermes/" TO="/d/$STAGE/"
                  fi
                  copy() { # copy [rsync options]: bring the stage in line with the source
                      docker run --rm --network host -v "$DATA_ROOT:/d" -v "$KEY:/key:ro" \
                          -v "$HOME/.ssh/known_hosts:/known_hosts:ro" "$IMAGE" \
                          rsync -aH --numeric-ids --delete \
                          --exclude=/data/cache/uv/ --exclude=/data/.cache/uv/ \
                          -e "ssh -p 2222 -i /key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/known_hosts" \
                          --rsync-path="$LAPTOP_ENV docker run --rm -i -v $DATA_ROOT:/d $IMAGE rsync" \
                          "$@" "$FROM" "$TO"
                  }

                  phase "preflight: $DIRECTION, dry_run=$DRY_RUN"
                  # Also records the laptop's host key, which copy() then requires.
                  run_on laptop "command -v docker >/dev/null"
                  run_on "$SRC" "test -d '$DATA_ROOT/hermes'" || { echo "no $DATA_ROOT/hermes on the $SRC" >&2; exit 1; }
                  if [ "$DRY_RUN" != true ]; then
                      if hermes_running "$DST"; then
                          echo "hermes is running on the $DST; refusing to overwrite its data" >&2; exit 1
                      fi
                      if [ "$SRC" = laptop ] && hermes_running laptop; then
                          echo "stop hermes on the laptop first (docker stop hermes there)" >&2; exit 1
                      fi
                  fi

                  for side in server laptop; do
                      run_on "$side" "printf 'FROM alpine:3\nRUN apk add --no-cache rsync openssh-client\n' | docker build -q -t $IMAGE - >/dev/null"
                  done

                  # Source size, read as root: data/ is owned by the container user.
                  SIZE_KB=$(run_on "$SRC" "docker run --rm -v '$DATA_ROOT/hermes:/src:ro' $IMAGE du -sk /src" | awk 'END {print $1}')
                  MARGIN_KB=$((1024 * 1024))
                  DST_FREE=$(free_kb "$DST")
                  echo "hermes data: $((SIZE_KB / 1024)) MiB; free on the $DST: $((DST_FREE / 1024)) MiB"
                  # The stage becomes the new hermes by a rename, so the receiving
                  # side needs room for one copy (less any earlier stage).
                  [ "$DST_FREE" -ge $((SIZE_KB + MARGIN_KB)) ] || { echo "not enough free space on the $DST" >&2; exit 1; }

                  phase "copying to the $DST's stage while hermes runs"
                  # 24: files vanished mid-copy, expected while hermes writes.
                  copy --info=stats1 || [ $? -eq 24 ]
                  if [ "$DRY_RUN" = true ]; then
                      phase "dry run done: the stage is ready; hermes was not stopped"
                      exit 0
                  fi

                  if [ "$SRC" = server ] && hermes_running server; then
                      phase "stopping the server's hermes"
                      echo "stopped_hermes=true" >> "$GITHUB_OUTPUT"
                      docker stop -t 60 hermes
                      ! hermes_running server || { echo "hermes did not stop" >&2; exit 1; }
                  fi

                  phase "final copy with hermes stopped"
                  copy --info=stats1
                  phase "checking that nothing differs"
                  DIFF=$(copy --dry-run --itemize-changes)
                  if [ -n "$DIFF" ]; then
                      echo "the stage still differs from the source:" >&2
                      printf '%s\n' "$DIFF" | head -20 >&2
                      exit 1
                  fi

                  # Never delete the receiving side's data: move it aside.
                  BAK="hermes.bak-$(date -u +%Y%m%dT%H%M%SZ)"
                  phase "moving the stage into place on the $DST"
                  run_on "$DST" "docker run --rm -v '$DATA_ROOT:/d' $IMAGE sh -c 'if [ -e /d/hermes ]; then mv /d/hermes /d/$BAK && echo moved existing hermes to $BAK; fi; mv /d/$STAGE /d/hermes'"
                  phase "done"

            # Brings Friday back on the server when a real to-laptop run fails or is cancelled
            # after stopping it. A successful run leaves it stopped: the
            # cutover deploy starts hermes on the laptop instead.
            - name: Restart the server's hermes after a failure
              if: (failure() || cancelled()) && steps.migrate.outputs.stopped_hermes == 'true'
              run: docker start hermes
