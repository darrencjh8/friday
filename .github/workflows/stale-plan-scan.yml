name: Stale plan scan

# Weekly scan for dev-loop plan files older than 7 days. It only OPENS AN
# ISSUE listing the candidates — it never deletes anything. Friday picks
# the issue up and removes the files through the normal dev-loop flow
# (plan, review, PR, the maintainer merges).
#
# The friday-maintainer GitHub App cannot push workflow files, so this
# file is applied by hand (see the handover patch on the tracking issue).

on:
  schedule:
    # Mondays 09:10 SGT (01:10 UTC)
    - cron: '10 1 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'List stale plans without opening an issue'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find stale plan files
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff=$(date -d '7 days ago' +%s)
          # Never list these: test_issue_185 reads the 185 file at test
          # time, and the other five are provenance for PII-allowlist
          # entries in scripts/pii-scan-allowlist.json.
          exempt="185-pii-allowlist-false-positives.md 695-portfolio-tracker-responses-auto-thinking.md hermes-deepseek-flash-routing.md litellm-account-pool-fallbacks.md hermes-v0217-upgrade.md pr-654-transfer-fix-review-findings.md"
          : > "$RUNNER_TEMP/stale.txt"
          : > "$RUNNER_TEMP/skipped.txt"
          for f in docs/plans/*.md; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            case " $exempt " in *" $base "*)
              echo "$base (exempt)" >> "$RUNNER_TEMP/skipped.txt"
              continue
              ;;
            esac
            last=$(git log -1 --format=%ct -- "$f")
            [ "$last" -lt "$cutoff" ] || continue
            num=""
            if [[ "$base" =~ ^([0-9]+)- ]]; then
              num="${BASH_REMATCH[1]}"
            elif [[ "$base" =~ ^issue-([0-9]+)- ]]; then
              num="${BASH_REMATCH[1]}"
            fi
            if [ -n "$num" ]; then
              state=$(gh api "repos/$GITHUB_REPOSITORY/issues/$num" --jq '.state' 2>/dev/null || echo unknown)
              if [ "$state" = "open" ]; then
                echo "$base (issue #$num still open)" >> "$RUNNER_TEMP/skipped.txt"
                continue
              fi
            fi
            echo "$base" >> "$RUNNER_TEMP/stale.txt"
          done
          total=$(wc -l < "$RUNNER_TEMP/stale.txt")
          echo "count=$total" >> "$GITHUB_OUTPUT"
          echo "Stale candidates: $total"
          cat "$RUNNER_TEMP/stale.txt"
          echo "Skipped:"
          cat "$RUNNER_TEMP/skipped.txt"

      - name: Open issue
        if: steps.scan.outputs.count != '0' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          open=$(gh issue list --label plan-cleanup --state open --limit 1 --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "An open plan-cleanup issue already exists; skipping."
            exit 0
          fi
          gh label create plan-cleanup --description "Stale dev-loop plan files awaiting cleanup" --color "5319E7" 2>/dev/null || true
          {
            echo "## Stale plan files (older than 7 days)"
            echo ""
            echo "These files under \`docs/plans/\` were last touched more than 7 days ago. Please remove them through the normal dev-loop flow (the driver never reads plan files from main after merge, and the blob stays in git history, so past approvals stay verifiable)."
            echo ""
            echo "Files with no matching issue are legacy plans; confirm each one before deleting."
            echo ""
            shown=$(head -20 "$RUNNER_TEMP/stale.txt")
            printf '%s\n' "$shown" | while read -r line; do echo "- \`docs/plans/$line\`"; done
            total=$(wc -l < "$RUNNER_TEMP/stale.txt")
            if [ "$total" -gt 20 ]; then
              echo ""
              echo "…and $((total - 20)) more (capped at 20 per run)."
            fi
          } > "$RUNNER_TEMP/issue-body.md"
          gh issue create --label plan-cleanup --title "Stale plan files older than 7 days" --body-file "$RUNNER_TEMP/issue-body.md"
