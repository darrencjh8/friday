# Runs the hermes-dots Android tests here in friday (public repo, free
# minutes) instead of hermes-dots (private repo, paid minutes).
#
# Two uses:
# - On demand: manual dispatch with `ref` (branch, tag, or commit SHA,
#   default `main`) and optional `smoke` for the emulator smoke test, so
#   an agent can run CI for any specific commit from friday.
# - Pre-release gate: hermes-dots-release.yml calls this workflow with
#   the hermes-dots HEAD SHA before building the release.
#
# All jobs run on GitHub-hosted cloud runners; unit and smoke on
# ubuntu-latest, rust on windows-latest (the app ships on Windows, so the
# check runs where it ships), never on the self-hosted runner.
# Steps are copied from the deleted hermes-dots workflows
# android-test.yml (unit) and android-emulator.yml (smoke).
name: Hermes-Dots CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to test (default: main)"
        type: string
        default: "main"
      smoke:
        description: "Also run the emulator smoke test"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to test"
        type: string
        default: "main"
      smoke:
        description: "Also run the emulator smoke test"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: darrencjh8/hermes-dots
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SUBMODULE_PAT }}

      # Friday's clips and icons come from the friday-persona release pinned in
      # persona-media.version; refs from before the move still carry the files.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: .friday
          sparse-checkout: scripts/fetch-persona-media.sh
          sparse-checkout-cone-mode: false

      - name: Fetch persona media
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_PAT }}
        run: |
          if [ -f persona-media.version ]; then bash .friday/scripts/fetch-persona-media.sh android .; fi
          rm -rf .friday

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a3 # v4

      - name: Check private-build safeguards
        run: ./scripts/check-hardening.sh

      - name: Run Android unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: darrencjh8/hermes-dots
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SUBMODULE_PAT }}

      # Friday's clips and icons come from the friday-persona release pinned in
      # persona-media.version; refs from before the move still carry the files.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: .friday
          sparse-checkout: scripts/fetch-persona-media.sh
          sparse-checkout-cone-mode: false

      - name: Fetch persona media
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_PAT }}
        shell: bash
        run: |
          bash .friday/scripts/fetch-persona-media.sh dots-web web
          rm -rf .friday

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Build the web dist
        shell: bash
        working-directory: web
        run: |
          npm ci
          npm run build

      # The app icon is Friday's launcher icon, never committed (persona media).
      - name: Icons
        shell: bash
        run: npx --yes @tauri-apps/cli@2.12.6 icon web/dist/icons/nova-default-512.png -o desktop/src-tauri/icons

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri

      # The voice installer (desktop/voice) ships uv, which fetches Python,
      # PyTorch and the speech models on the user's PC into the folder they
      # choose. Pinned and checked here; never committed. tauri.conf.json
      # lists uv/uv.exe as a resource, so cargo check needs it present.
      # Copied from hermes-dots-desktop.yml.
      - name: uv for the voice installer
        shell: bash
        working-directory: desktop/src-tauri
        env:
          UV_VERSION: '0.13.9'
          UV_SHA256: 'edd61f7f5728a56cc62455386661860bdfc7bab65872f39b0c25bdcc1d8e1beb'
        run: |
          curl -fsSLo uv.zip "https://github.com/astral-sh/uv/releases/download/$UV_VERSION/uv-x86_64-pc-windows-msvc.zip"
          echo "$UV_SHA256  uv.zip" | sha256sum -c -
          7z e uv.zip uv.exe -ouv -y
          rm uv.zip

      - name: Check the desktop Rust
        shell: bash
        working-directory: desktop/src-tauri
        run: cargo check

  smoke:
    if: ${{ inputs.smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: darrencjh8/hermes-dots
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SUBMODULE_PAT }}

      # Friday's clips and icons come from the friday-persona release pinned in
      # persona-media.version; refs from before the move still carry the files.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: .friday
          sparse-checkout: scripts/fetch-persona-media.sh
          sparse-checkout-cone-mode: false

      - name: Fetch persona media
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_PAT }}
        run: |
          if [ -f persona-media.version ]; then bash .friday/scripts/fetch-persona-media.sh android .; fi
          rm -rf .friday

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a3 # v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Download the two latest releases
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_PAT }}
        run: |
          mkdir -p release
          # Phone releases only: desktop-v* releases carry a Windows installer, no APK.
          tags=$(gh release list -R darrencjh8/hermes-dots --limit 20 --json tagName | jq -r '.[].tagName | select(startswith("desktop-v") | not)' | head -n 2)
          set -- $tags
          gh release download "$1" -R darrencjh8/hermes-dots -p '*.apk' -O release/latest.apk
          [ -n "${2:-}" ] && gh release download "$2" -R darrencjh8/hermes-dots -p '*.apk' -O release/previous.apk || true

      - name: Free disk for the emulator
        # The emulator's data partition needs ~7.4 GB; the runner ships toolchains this job never uses.
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL && df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, switch icons, update, relaunch
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./scripts/emulator-smoke.sh
