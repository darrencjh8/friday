name: Codex Router CI

on:
    workflow_dispatch:
        inputs:
            router_ref:
                description: "Reviewed Codex Router commit SHA"
                required: true
                type: string
    repository_dispatch:
        types: [codex-router-ci]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Check out private Codex Router
              uses: actions/checkout@v4
              with:
                  repository: darrencjh8/codex-router
                  ref: ${{ github.event.inputs.router_ref || github.event.client_payload.router_ref || 'main' }}
                  token: ${{ secrets.SUBMODULE_PAT }}
                  persist-credentials: false
                  path: codex-router

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              working-directory: codex-router
              run: python -m pip install --requirement requirements.txt

            - name: Run unit and regression tests
              working-directory: codex-router
              run: python -m unittest discover -s tests -p "test_*.py"

            - name: Validate Docker contract
              working-directory: codex-router
              run: bash tests/test_docker.sh

    live-providers:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: darren-prod
        steps:
            - name: Check out trusted Codex Router smoke tests
              uses: actions/checkout@v4
              with:
                  repository: darrencjh8/codex-router
                  ref: main
                  token: ${{ secrets.SUBMODULE_PAT }}
                  persist-credentials: false
                  path: trusted-router

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install trusted probe dependency
              run: python -m pip install httpx==0.28.1

            - name: Smoke-test auto-thinking external providers
              working-directory: trusted-router
              env:
                  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
              run: |
                  test -n "$DEEPSEEK_API_KEY"
                  python tests/test_provider_smoke_live.py
